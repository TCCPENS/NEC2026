{% extends 'base.html' %}
{% block title %}Masuk Redaksi — NEC Newsroom{% endblock %}
{% block content %}
<p class="eyebrow">Ruang redaksi</p>
<h1>Masuk ke panel berita</h1>
<p class="muted">Akses ini digunakan oleh tim redaksi untuk memperbarui informasi kegiatan NEC.</p>
{% if error %}<p>{{ error }}</p>{% endif %}
<form method="post">
  <label>Nama pengguna<input name="log" autocomplete="username" required></label>
  <label>Kata sandi<input type="password" name="pwd" autocomplete="current-password" required></label>
  <button type="submit">Masuk</button>
</form>
{% endblock %}
