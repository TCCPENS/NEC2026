worker_processes 4;

events {
    worker_connections 1024;
}

http {
    # Keep proxy connections alive while allowing clients to close them cleanly.
    map $http_connection $connection_header {
        default keep-alive;
        ''      '';
    }

    # Application server CTFd
    upstream app_servers {
        server ctfd:8000;
    }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name nec2026.capoeng.id;

        return 308 https://nec2026.capoeng.id$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name nec2026.capoeng.id;

        ssl_certificate /etc/letsencrypt/live/nec2026.capoeng.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nec2026.capoeng.id/privkey.pem;

        gzip on;
        client_max_body_size 4G;

        # Server Sent Events / Notifications. Keep this endpoint unbuffered;
        # otherwise Nginx can hold heartbeats and the browser reconnects.
        location = /events {
            proxy_pass http://app_servers;

            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_connect_timeout 30s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header X-Forwarded-Prefix "";
        }

        # Semua request CTFd lainnya
        location / {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_redirect off;

            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection $connection_header;

            proxy_set_header X-Forwarded-Prefix "";
        }
    }
}
